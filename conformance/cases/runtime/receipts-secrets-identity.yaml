- id: RP-RCPT-001
  title: A completed receipt is canonical, integrity-protected and vendor-neutral
  category: receipt_generation
  level: runtime
  kind: execution
  given:
    providers: [fixtures/providers/example-email.yaml]
    authority: fixtures/authority/support.yaml
    policy: fixtures/policy/allow-all.yaml
    credentials:
      [{ provider: example-email, ref: secret://organization/providers/example-production }]
    secrets: { secret://organization/providers/example-production: canary-rcpt-key-0001 }
  request: fixtures/requests/send-email.yaml
  expect:
    state: completed
    receipt:
      status: completed
      provider: example-email
      credential_owner: organization
      has:
        [
          receipt_id,
          request_id,
          execution_id,
          capability,
          actor,
          authority,
          policy,
          created_at,
          started_at,
          completed_at,
          evidence,
          issued_at,
        ]
      forbidden: [secret://organization/providers/example-production]
- id: RP-RCPT-002
  title: A rejected receipt records the refusal and was never dispatched
  category: receipt_generation
  level: runtime
  kind: execution
  given:
    providers: [fixtures/providers/example-email.yaml]
    authority: fixtures/authority/support.yaml
    policy: fixtures/policy/allow-all.yaml
  request:
    {
      $base: fixtures/requests/send-email.yaml,
      $patch: { capability: { id: communication.shout } },
    }
  expect:
    state: rejected
    error: { code: unknown_capability }
    provider_invocations: 0
    receipt: { status: rejected, provider: null, lacks: [started_at] }
- id: RP-SECRET-003
  title: A provider result carrying secret material is rejected and never stored
  category: raw_secret_rejection
  level: runtime
  kind: execution
  given:
    providers: [fixtures/providers/leaky-kb.yaml]
    authority: fixtures/authority/support.yaml
    policy: fixtures/policy/allow-all.yaml
  request: fixtures/requests/search.yaml
  expect:
    state: failed
    error: { code: execution_failed }
    forbidden: [sk-conformanceleakedkey0000000000]
- id: RP-SECRET-004
  title: A materialized credential echoed by a provider error is redacted
  category: raw_secret_rejection
  level: runtime
  kind: execution
  given:
    providers: [fixtures/providers/echo-email.yaml]
    authority: fixtures/authority/support.yaml
    policy: fixtures/policy/allow-all.yaml
    credentials: [{ provider: echo-email, ref: secret://organization/providers/echo }]
    secrets: { secret://organization/providers/echo: canary-echo-secret-7f3a }
  request: fixtures/requests/send-email.yaml
  expect:
    state: failed
    error: { code: execution_failed }
    provider_invocations: 1
    forbidden: [canary-echo-secret-7f3a]
- id: RP-ID-001
  title: Resubmitting the same request returns the same execution
  category: request_identity
  level: runtime
  kind: execution
  given:
    providers: [fixtures/providers/kb-eu.yaml]
    authority: fixtures/authority/support.yaml
    policy: fixtures/policy/allow-all.yaml
  request: fixtures/requests/search.yaml
  then:
    - resubmit: true
  expect:
    state: completed
    executions: 1
    provider_invocations: 1
- id: RP-ALIAS-002
  title: An execution requested through a deprecated alias records it in the receipt
  category: deprecated_alias
  level: runtime
  kind: execution
  given:
    overlays: [fixtures/overlays/acme-alias.yaml]
    providers: [fixtures/providers/example-email.yaml]
    authority: fixtures/authority/support.yaml
    policy: fixtures/policy/allow-all.yaml
    credentials:
      [{ provider: example-email, ref: secret://organization/providers/example-production }]
    secrets: { secret://organization/providers/example-production: canary-alias-key-0001 }
  request:
    $base: fixtures/requests/send-email.yaml
    $patch: { capability: { id: org.acme.message.dispatch } }
  expect:
    state: completed
    warnings: [deprecated_alias]
    receipt: { status: completed, requested_as: org.acme.message.dispatch }
