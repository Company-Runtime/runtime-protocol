- id: RP-SECRET-001
  title: Secret material in a request is rejected without echoing it
  category: raw_secret_rejection
  level: document
  kind: request
  request:
    {
      $base: fixtures/requests/send-email.yaml,
      $patch: { input: { content: "Bearer conformance0000000000000000" } },
    }
  expect: { error: { code: invalid_request, detail: raw_secret } }
- id: RP-SECRET-002
  title: Secret material in a provider manifest is rejected
  category: raw_secret_rejection
  level: document
  kind: document
  document_type: provider-manifest
  document:
    $base: ../examples/provider-manifest/example-provider.yaml
    $patch: { extensions: { vendor.example: { api_key: not-a-reference } } }
  expect: { valid: false }
- id: RP-NS-001
  title: An extension identifier cannot shadow a core capability
  category: namespace_isolation
  level: document
  kind: request
  request:
    {
      $base: fixtures/requests/send-email.yaml,
      $patch: { capability: { id: vendor.acme.communication.send } },
    }
  expect: { error: { code: invalid_request, detail: namespace_violation } }
- id: RP-NS-002
  title: An overlay cannot redefine core semantics under a namespace
  category: namespace_isolation
  level: document
  kind: document
  document_type: registry-overlay
  document: fixtures/overlays/shadow-core.yaml
  expect: { valid: false }
- id: RP-NS-003
  title: A vendor extension with its own domain and a canonical verb is valid
  category: namespace_isolation
  level: document
  kind: document
  document_type: registry-overlay
  document: fixtures/overlays/vendor-extension.yaml
  expect: { valid: true }
- id: RP-NS-004
  title: A provider cannot implement a shadowing identifier
  category: namespace_isolation
  level: document
  kind: document
  document_type: provider-manifest
  document:
    $base: ../examples/provider-manifest/example-provider.yaml
    $patch:
      implements:
        - { capability: vendor.acme.communication.send, versions: ["^0.1"], traits: [idempotency] }
  expect: { valid: false }
- id: RP-ALIAS-001
  title: A deprecated alias is normalized with a warning
  category: deprecated_alias
  level: document
  kind: request
  given: { overlays: [fixtures/overlays/acme-alias.yaml] }
  request:
    {
      $base: fixtures/requests/send-email.yaml,
      $patch: { capability: { id: org.acme.message.dispatch } },
    }
  expect:
    {
      valid: true,
      warnings: [deprecated_alias],
      capability: { id: communication.send, requested_as: org.acme.message.dispatch },
    }
