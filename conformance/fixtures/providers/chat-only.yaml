manifest:
  protocol: runtime/0.1
  provider: { id: chat-only, version: 2.1.0 }
  implements:
    - capability: communication.send
      versions: ["^0.1"]
      profiles: [chat]
      traits: [idempotency]
      evidence: { claims: [execution], types: [provider_receipt] }
      cost: { estimate: { amount: 0.0001, currency: USD } }
  credentials: { required: false, accepts: [] }
behavior:
  communication.send:
    result: completed
    output:
      {
        message: { ref: resource://conformance/outbox/msg-1 },
        accepted_recipients: [identity://customer/981],
      }
    evidence:
      - {
          type: provider_receipt,
          claims: [execution],
          observed_at: "2026-01-01T00:00:01Z",
          data: { accepted: true },
        }
