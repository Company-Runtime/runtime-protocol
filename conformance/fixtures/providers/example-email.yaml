# The reference email provider of the end-to-end smoke scenario.
manifest:
  protocol: runtime/0.1
  provider: { id: example-email, version: 1.0.0 }
  implements:
    - capability: communication.send
      versions: ["^0.1"]
      profiles: [email, chat]
      traits: [attachments, delivery_receipt, idempotency]
      evidence: { claims: [execution, delivery], types: [provider_receipt] }
      cost: { estimate: { amount: 0.001, currency: USD } }
      regions: [eu, us]
      reconciliation: supported
  credentials: { required: true, accepts: [organization, runtime] }
  bindings: [{ type: in_process }]
behavior:
  communication.send:
    result: completed
    output:
      {
        message: { ref: resource://conformance/outbox/msg-1 },
        accepted_recipients: [identity://customer/981],
      }
    evidence:
      - {
          type: provider_receipt,
          claims: [execution],
          observed_at: "2026-01-01T00:00:01Z",
          data: { accepted: true },
        }
      - {
          type: provider_receipt,
          claims: [delivery],
          observed_at: "2026-01-01T00:00:01Z",
          data: { delivered: [identity://customer/981] },
        }
    cost: { amount: 0.001, currency: USD }
