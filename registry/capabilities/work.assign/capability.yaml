id: work.assign
version: 0.1.0
status: experimental
domain: work
verb: assign
description: Give responsibility for a unit of work to an actor.
input: { schema_ref: ./input.schema.json }
output: { schema_ref: ./output.schema.json }
profiles: []
traits:
  optional: [idempotency]
authority: { required: true }
evidence: { supported: true, claims: [execution, state] }
risk: { default: low }
effects: { mutating: true }
emits: [work.assigned]
relations:
  requires: [identity]
  related: [work.create]
rfc: "0001"
