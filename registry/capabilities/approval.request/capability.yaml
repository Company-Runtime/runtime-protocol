id: approval.request
version: 0.1.0
status: experimental
domain: approval
verb: request
description: Ask accountable actors for a decision, creating a pending approval.
input: { schema_ref: ./input.schema.json }
output: { schema_ref: ./output.schema.json }
profiles: []
traits:
  optional: [idempotency]
authority: { required: true }
evidence: { supported: true, claims: [execution, state] }
risk: { default: low }
effects: { mutating: true }
emits: [approval.requested]
relations:
  requires: [identity]
  related: [approval.decide]
rfc: "0001"
